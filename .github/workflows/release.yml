# Músicos MX — compila los instaladores de todas las plataformas y los publica en el Release
name: Instaladores
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta del release donde subir los instaladores (ej. v1.0.0)'
        required: true
permissions:
  contents: write
env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Subir al release
        shell: bash
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "$TAG" release/Musicos-MX-Setup-*.exe release/Musicos-MX-*-portable.exe --clobber
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Subir al release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: gh release upload "$TAG" release/*.dmg release/*-mac-*.zip --clobber
  linux-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y rpm aapt apksigner zipalign dalvik-exchange android-sdk-platform-23 librsvg2-bin
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --linux --publish never
      - name: APK de Android
        env:
          ANDROID_KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > /tmp/ks.keystore; export ANDROID_KEYSTORE=/tmp/ks.keystore; fi
          bash android/build-apk.sh
      - name: Subir al release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        # no reemplaza archivos ya publicados (p. ej. subidos y probados manualmente)
        run: for f in release/*.AppImage release/*.deb release/*.rpm release/*.apk; do gh release upload "$TAG" "$f" || echo "Ya existe: $f"; done
